[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-motion-lab"
version = "0.1.0"
description = "Foundation control panel and diagnostics for MouseMotionLab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "MouseMotionLab contributors"}]
dependencies = [
  "PySide6>=6.7,<7",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "platformdirs>=4,<5",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "pyarrow>=17,<21"]
collection = ["pyarrow>=17,<21"]
training = ["torch>=2.6,<2.7", "onnxruntime>=1.21,<1.22"]

[project.scripts]
mousemotionlab = "apps.control_panel.main:main"
mousemotionlab-worker = "apps.worker.__main__:main"
mouselearn = "mouselearn.cli:main"

[tool.setuptools.packages.find]
include = ["apps*", "mouselearn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
